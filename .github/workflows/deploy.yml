name: deploy-dev

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_DIR: infra/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Lambda packages
        run: |
          python -m pip install --upgrade pip wheel
          PYTHON=python scripts/build_lambdas.sh

      - name: Terraform init
        run: |
          cat > $TF_DIR/backend.hcl <<EOT
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "inventory-capture/dev/terraform.tfstate"
          region         = "${{ env.AWS_REGION }}"
          dynamodb_table = "${{ vars.TF_LOCK_TABLE }}"
          encrypt        = true
          EOT
          terraform -chdir=$TF_DIR init -input=false -backend-config=backend.hcl

      - name: Ensure ECR repository
        run: terraform -chdir=$TF_DIR apply -input=false -auto-approve -target=module.ecs_relay.aws_ecr_repository.this -var relay_image=bootstrap

      - name: Build and push relay image
        id: image
        run: |
          ECR=$(terraform -chdir=$TF_DIR output -raw relay_ecr_repository_url)
          echo "uri=$(scripts/build_relay_image.sh $ECR | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Terraform apply
        env:
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
          TF_VAR_amplify_access_token: ${{ secrets.AMPLIFY_ACCESS_TOKEN }}
        run: |
          terraform -chdir=$TF_DIR plan -input=false -out=tfplan -var relay_image=${{ steps.image.outputs.uri }}
          terraform -chdir=$TF_DIR apply -input=false -auto-approve tfplan

      - name: Smoke test
        run: |
          API=$(terraform -chdir=$TF_DIR output -raw api_url)
          curl -fsS "$API/health"
