[project]
name = "inventory-local-gateway"
version = "0.1.0"
description = "Local API Gateway HTTP API emulator: ingest Lambda + core-api ASGI app on :8080"
requires-python = ">=3.12"
dependencies = [
  "inventory-common",
  "inventory-ingest",
  "inventory-core-api",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]
