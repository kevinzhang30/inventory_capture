[project]
name = "inventory-desktop"
version = "0.1.0"
description = "Receiving-dock capture app: barcode scans (HID wedge + camera) and packing-slip photos"
requires-python = ">=3.12"
dependencies = [
  "capture-client",
  "PySide6>=6.7",
  "opencv-python-headless>=4.10",
  "pyzbar>=0.1.9",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.scripts]
inventory-desktop = "inventory_desktop.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inventory_desktop"]
