[project]
name = "inventory-review-dispatcher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "inventory-common",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fakeredis[lua]>=2.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["review_dispatcher"]
