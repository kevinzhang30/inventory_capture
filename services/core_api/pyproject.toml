[project]
name = "inventory-core-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "inventory-common",
  "fastapi>=0.115",
  "mangum>=0.19",
  "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fakeredis[lua]>=2.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core_api"]
