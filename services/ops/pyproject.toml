[project]
name = "inventory-ops"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "inventory-common",
  "inventory-indexer",
  "alembic>=1.13",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fakeredis[lua]>=2.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ops"]
