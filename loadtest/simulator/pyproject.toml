[project]
name = "inventory-simulator"
version = "0.1.0"
description = "Headless multi-station capture simulator and scan-to-visible latency probe"
requires-python = ">=3.12"
dependencies = ["capture-client", "httpx>=0.27", "boto3>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulator"]
