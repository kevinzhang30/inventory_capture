[project]
name = "capture-client"
version = "0.1.0"
description = "Desktop capture client: local SQLite outbox, sync engine, API client, synthetic packing slips"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "uuid6>=2024.7.10", "pillow>=10.4", "keyring>=25", "boto3>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capture_client"]
