[project]
name = "inventory-common"
version = "0.1.0"
description = "Shared server-side library for the inventory capture platform"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "redis>=5.0",
  "confluent-kafka>=2.5",
  "aws-msk-iam-sasl-signer-python>=1.0.1",
  "pika>=1.3",
  "opensearch-py>=3.0",
  "boto3>=1.35",
  "uuid6>=2024.7.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fakeredis[lua]>=2.23", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inventory_common"]
